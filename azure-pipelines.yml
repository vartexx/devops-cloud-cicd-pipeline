trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: 'acr-service-connection'
  imageRepository: 'devops-dashboard'
  containerRegistry: 'harshregistry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  k8sServiceConnection: 'aks-service-connection'
  kubernetesNamespace: 'default'

stages:
- stage: BuildAndTest
  displayName: Build & Unit Test
  jobs:
  - job: CI
    displayName: Continuous Integration
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm ci
      displayName: 'Install dependencies'

    - script: |
        npm test
      displayName: 'Execute unit tests'

- stage: BuildAndPushImage
  displayName: Docker Package & Push
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: BuildDocker
    displayName: Build Container
    steps:
    - task: Docker@2
      displayName: Build and push image to ACR
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: DeployToAKS
  displayName: Deploy to Azure Kubernetes Service
  dependsOn: BuildAndPushImage
  condition: succeeded()
  jobs:
  - job: DeployCD
    displayName: Continuous Deployment
    steps:
    - task: KubernetesManifest@0
      displayName: Deploy to AKS
      inputs:
        action: deploy
        kubernetesServiceConnection: $(k8sServiceConnection)
        namespace: $(kubernetesNamespace)
        manifests: |
          $(System.DefaultWorkingDirectory)/k8s/deployment.yaml
          $(System.DefaultWorkingDirectory)/k8s/service.yaml
          $(System.DefaultWorkingDirectory)/k8s/hpa.yaml
        containers: |
          $(containerRegistry)/$(imageRepository):$(tag)

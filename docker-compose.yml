version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: harsh/devops-dashboard:latest
    container_name: devops_dashboard_container
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
